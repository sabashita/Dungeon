<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="author" content="Haiyang Li">
    <meta name="shopstore" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <title>Dungeon Loot Splitter</title>
    <h1>Dungeon Loot Splitter</h1>
    <script src="js/script.js" defer></script>

</head>



<main>
    <div class="wrapper" id="partyPanel">
        <div class="col" style="width: 32%;">
            <h2>Party Setup</h2>
            <div>

                <label for="partySize">Members:</label>
                <input id="partySize" type="number" min="1" >
                
                
            </div>
            <div id="partyList"></div>
        </div>
        <div class="col" style="width: 32%;">
            <h2>Add Loot</h2>
            <label for="lootName">Loot Name:</label>
            <input id="lootName" type="text" >
            <label for="lootValue">Loot Value:</label>
            <input id="lootValue" type="number" step="0.01" >
            <input id="addBtn" type="button" value="addLot" name="addLot">
            <p id="addMsg"></p>

        </div>
        <div class="col" style="width: 32%;">
            <h2>Loot List</h2>
            <ul id="lootList">

            </ul>
            <p>Total of Loot:</p> <input id="runningTotal" type="text" disabled >
        </div>

    </div>


    <div class="wrapper" id="splitPanel">
        <div class="col"  style="width: 50%;">
            <h2>Logic Explanation</h2>
            <img src="images/sketch.png" alt="Logic flow sketch" width="150" height="150">
        </div>
        <div class="col" style="width: 50%;">
            <h2>Split Loot</h2>
            
            <div id="results">
                <p>Total Loot: <input id="finalTotal" type="text" disabled ></p>
                <p>Loot Per Party Member:<input id="perMember" type="text" disabled ></p>
            </div>
                <input id="resetBtn" type="button" value="Reset All">
                <input id="syncBtn" type="button" value="Sync to Server">
                <input id="loadBtn" type="button" value="Load from Server">
            <p id="splitMsg"></p>
            <p id="serverMsg"></p>
        </div>
        
    </div>


</main>

</html>
